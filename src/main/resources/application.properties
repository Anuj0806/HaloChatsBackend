spring.application.name=${SPRING_APPLICATION_NAME:chatapp}

server.port=${SERVER_PORT:2000}
server.address=${SERVER_ADDRESS:0.0.0.0}


# ===============================
# POSTGRESQL DATASOURCE
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.jdbc.time_zone=${SPRING_JPA_TIME_ZONE:Asia/Kolkata}

spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}


# ===============================
# MAIL
# ===============================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}

spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}

spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}

spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}


# ===============================
# SECURITY
# ===============================

app.security.reset-token-secret=${RESET_TOKEN_SECRET:}

app.security.jwt-secret=${JWT_SECRET:}


# ===============================
# CORS
# ===============================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}


# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.messaging=${SPRING_MESSAGING_LOG_LEVEL:DEBUG}